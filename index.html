<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="dinoicon.png">
</head>
<body>
    <div class="gen-container">
        <div class="container">
            <form onsubmit="verify(event)">
                <p><h2>Ingrese la contraseña</h2></p>
                <input type="password" id="input" placeholder="Contraseña" required>
                <button type="button" id="ver">Ver</button><br>
                <p id="alert"></p>
                <button type="submit" id="submit">Continuar</button>
            </form>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
